[package]
name = "oldstar"
version = "0.0.1"
description = "Télécommande web pour iPad : console Yamaha CL/QL, CueStar et JingleStar en OSC, fenêtres du PC capturées (Windows, macOS)"
authors = ["Pierrick"]
edition.workspace = true
license.workspace = true

[dependencies]
star-core.workspace = true
star-ui.workspace = true
# Même eframe que les autres applis (rendu wgpu). Pas de fonctionnalité « glow » : réunie avec
# les autres applis dans MediaStar, elle change la signature de `App::on_exit` pour toutes.
eframe.workspace = true
egui.workspace = true
# QR code de l'adresse à taper sur la tablette (pur Rust).
qrcode = { version = "0.14", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rosc = "0.11"
if-addrs = "0.15"
image = { version = "0.25", default-features = false, features = ["jpeg"] }

[build-dependencies]
star-build.workspace = true

[target."cfg(windows)".dependencies]
# Capture des fenêtres (PrintWindow) et clics simulés (SendInput / PostMessage).
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Storage_Xps",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
] }

[target."cfg(target_os = \"macos\")".dependencies]
# Capture des fenêtres (ScreenCaptureKit) et clics simulés (CGEvent), Intel et Apple Silicon.
objc2 = "0.6"
block2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSArray", "NSError", "NSString", "NSDictionary", "NSValue", "NSThread"] }
objc2-core-foundation = { version = "0.3", default-features = false, features = ["std", "CFArray", "CFDictionary", "CFNumber", "CFString", "CFBase", "CFCGTypes", "CFData"] }
objc2-core-graphics = { version = "0.3", default-features = false, features = ["std", "CGWindow", "CGEvent", "CGEventTypes", "CGEventSource", "CGImage", "CGDataProvider", "CGColorSpace", "CGContext", "CGBitmapContext", "CGDirectDisplay", "CGRemoteOperation", "CGGeometry", "CGError", "objc2", "libc"] }
objc2-screen-capture-kit = { version = "0.3", default-features = false, features = ["std", "block2", "objc2-core-graphics", "SCShareableContent", "SCScreenshotManager", "SCStream", "objc2-core-media"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSRunningApplication", "libc"] }
